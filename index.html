<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor de indicadores turísticos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--v:#1B5E4B;--d:#B8996B;--f:#FBFAF7;--t:#2b2b2b;--g:#6b6b6b}
*{box-sizing:border-box}body{margin:0;background:var(--f);color:var(--t);font-family:"Segoe UI",system-ui,sans-serif}
header{background:var(--v);color:#fff;padding:22px 32px}
header h1{margin:0;font-size:26px;letter-spacing:.5px}header p{margin:4px 0 0;color:#e6d9bd;font-size:14px}
main{max-width:1200px;margin:0 auto;padding:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1.5px solid var(--v);background:#fff;color:var(--v);padding:8px 16px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:600}
.chip.on{background:var(--v);color:#fff}.chip:disabled{opacity:.35;cursor:not-allowed}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:#fff;border:1px solid #e3e0d8;border-radius:14px;padding:12px 16px;margin-bottom:16px}
.bar label{font-size:13px;color:var(--g)}select{padding:7px 10px;border:1px solid #cfcabd;border-radius:8px;font-size:14px;background:#fff}
.q{border:1px solid var(--d);background:#fff;color:#7a6338;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;margin-right:4px}
.q:hover{background:var(--d);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid #e3e0d8;border-radius:14px;padding:14px 16px;border-top:4px solid var(--v)}
.kpi.o{border-top-color:var(--d)}.kpi small{color:var(--g);font-size:12px}
.kpi b{display:block;font-size:24px;color:var(--v);margin-top:4px}.kpi span{font-size:12px;color:var(--g)}
.up{color:#1B7A4B}.dn{color:#B23A3A}
.card{background:#fff;border:1px solid #e3e0d8;border-radius:14px;padding:18px}
.card h2{margin:0;color:var(--v);font-size:20px}.card h3{margin:2px 0 12px;color:var(--d);font-size:14px;font-weight:600}
.cv{position:relative;height:420px}
.opts{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--g);align-items:center}
.opts button{margin-left:auto}
footer{font-size:12px;color:var(--g);margin-top:8px}
</style></head><body>
<header><h1 id="tit"></h1><p>Indicadores turísticos mensuales · Fuente: DATATUR / SECTUR</p></header>
<main>
<div class="chips" id="chips"></div>
<div class="bar">
 <label>Desde</label><select id="d"></select><label>Hasta</label><select id="h"></select>
 <span id="rap"></span>
</div>
<div class="kpis" id="kpis"></div>
<div class="card"><h2 id="gt"></h2><h3 id="gs"></h3><div class="cv"><canvas id="c"></canvas></div>
 <div class="opts"><label><input type="checkbox" id="tr" checked> Tendencia</label>
 <label><input type="checkbox" id="et" checked> Etiquetas</label>
 <span id="nota"></span><button class="q" id="png">Descargar PNG</button></div></div>
<footer>Línea punteada: tendencia del primer al último dato del periodo. Dato más alto resaltado en dorado.</footer>
</main>

const CFG={total:{t:"Llegada de turistas a hoteles",k:"n"},nacionales:{t:"Llegada de turistas nacionales",k:"n"},
no_residentes:{t:"Llegada de turistas no residentes",k:"n"},ocupacion:{t:"Ocupación hotelera",k:"p"},
vuelos:{t:"Vuelos",k:"v"},pasajeros:{t:"Pasajeros",k:"n"},cruceros:{t:"Cruceros",k:"v"}};
const M=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MC=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

const labC=i=>{const[a,m]=D.fechas[i].split("-");return MC[m-1]+" "+a};

Object.keys(CFG).forEach(k=>{const b=document.createElement("button");b.className="chip";b.textContent=CFG[k].t.replace(" a hoteles","");

[...new Set(D.fechas.map(f=>f.slice(0,4)))].forEach(y=>{const ix=D.fechas.map((f,i)=>f.startsWith(y)?i:-1).filter(i=>i>=0);q(y,ix[0],ix[ix.length-1])});

 m.data.forEach((p,i)=>{if(v[i]==null)return;if(dense&&i!=iM&&i!=iF&&i%2)return;

 document.querySelectorAll(".chip").forEach(b=>b.classList.toggle("on",b.id=="c_"+K));
 const s=D.series[K],ix=[];for(let i=A;i<=B;i++)ix.push(i);

$("png").onclick=()=>{

 const H=Math.round(80*k),P=Math.round(24*k),F=Math.round(28*k);
